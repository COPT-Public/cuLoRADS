name: Binary package checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to validate
        required: true
        default: v1.1.0
        type: string
      run_gpu:
        description: Run the published binary on a self-hosted NVIDIA runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  repository:
    name: Repository metadata and scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify the binary-only repository
        run: bash scripts/check_repository.sh

  gpu-release:
    name: Published release / NVIDIA GPU
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_gpu }}
    runs-on: [self-hosted, linux, x64, nvidia-gpu]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-validation.txt
      - name: Check runner tools
        run: |
          command -v curl
          command -v sha256sum
          command -v tar
          command -v zstd
          nvidia-smi
      - name: Download the published release payload
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          curl -fL --retry 3 -O \
            "$release_url/cuLoRADS-1.1.0-linux-x86_64.tar.zst"
          curl -fL --retry 3 -O \
            "$release_url/cuLoRADS-1.1.0-linux-x86_64.tar.zst.sha256"
      - name: Verify and extract the release
        run: |
          bash scripts/check_package.sh
          mkdir -p _release_test
          tar --zstd -xf cuLoRADS-1.1.0-linux-x86_64.tar.zst -C _release_test
          _release_test/cuLoRADS-1.1.0-linux-x86_64/scripts/verify_install.sh
      - name: Install numerical-validation dependencies
        run: python -m pip install --requirement scripts/requirements-validation.txt
      - name: Run and verify the GPU example
        env:
          CULORADS_CACHE_DIR: ${{ runner.temp }}/culorads-cache
        run: |
          application="$PWD/_release_test/cuLoRADS-1.1.0-linux-x86_64"
          "$application/scripts/run_example.sh"
          python scripts/verify_tiny_solution.py \
            "$application/results/tiny.out.mat"
